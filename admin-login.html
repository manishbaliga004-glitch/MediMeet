<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediMeet | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f7fa, #e8eaf6);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: #087f8c;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #263238;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #37474f;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #087f8c;
            box-shadow: 0 0 0 2px rgba(8, 127, 140, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #087f8c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #066570;
        }

        .error {
            color: #d32f2f;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #087f8c;
            text-decoration: none;
        }

        .admin-icon {
            text-align: center;
            font-size: 42px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">MediMeet</div>

        <p class="subtitle">
            Hospital Appointment Booking System
        </p>

        <div class="admin-icon">🛡️</div>

        <h2>Admin Login</h2>

        <form id="login-form">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter admin username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <p class="error" id="error-message"></p>

            <button type="submit">Login to Dashboard</button>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

    <script>
        document.getElementById("login-form").addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;

                const errorMessage =
                    document.getElementById("error-message");

                if (username === "admin" && password === "admin123") {

                    sessionStorage.setItem("medimeetAdminLoggedIn", "true");

                    window.location.href = "admin-dashboard.html";

                } else {

                    errorMessage.textContent =
                        "Invalid username or password.";

                }
            }
        );
    </script>

</body>
</html>
